name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  projekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          LLM_MOCK: "1"
  docker:
    # Nobody on the team has Docker locally: this job is the proof that `docker compose up` works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: The app page is served
        run: |
          curl -fsS http://localhost:8000/_stcore/health | grep -q ok
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
      - name: The UI renders in the image without an exception
        run: |
          docker compose exec -T app python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('frontend/app.py', default_timeout=120)
          at.run()
          assert not at.exception, [e.value for e in at.exception]
          assert at.button, 'no buttons rendered'
          print('UI ok:', len(at.button), 'buttons')"
      - name: State is on the volume and survives a restart
        # the API runs inside the Streamlit process (no HTTP /api), so the check talks to it in the container
        run: |
          docker compose exec -T app python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          r = TestClient(app).post('/api/demo/clock', json={'ustaw_date': '2026-09-01'})
          assert r.status_code == 200, r.text"
          docker compose exec -T app test -s /data/app.db
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T app python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          d = TestClient(app).get('/api/demo/clock').json()
          print(d)
          assert d['dzis'] == '2026-09-01', d"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

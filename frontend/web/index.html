<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyfrowy Asystent Ocen Okresowych</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Nawigacja główna">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true" id="brand-icon"></div>
        <div class="brand-text">
          <div class="brand-name">Asystent Ocen Okresowych</div>
          <div class="brand-sub">Służba cywilna</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="nav-foot" id="nav-user"></div>
    </aside>

    <div class="page">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="view" tabindex="-1">
        <div class="loading"><span class="spinner" aria-hidden="true"></span>Wczytywanie…</div>
      </main>
    </div>
  </div>
  <div class="toast-area" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
